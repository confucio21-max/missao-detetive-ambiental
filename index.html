<style>
:root{
  --forest:#0f3d2e; --forest-2:#164e3b; --leaf:#22a865; --leaf-soft:#d8f3e3;
  --sun:#f5b82e; --sun-soft:#fdeec7; --river:#2a7fd4; --river-soft:#dcebfb;
  --clay:#e0643c; --clay-soft:#fbe1d7;
  --paper:#fbf6ec; --card:#ffffff; --ink:#1b2a24; --muted:#5d6b64; --line:#e7e0d1;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:"Bricolage Grotesque",Nunito,sans-serif;line-height:1.08;letter-spacing:-.01em}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 18px 28px}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);flex:none}
.back[hidden]{visibility:hidden;display:grid}
.bar{flex:1;height:12px;background:#ece4d3;border-radius:99px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--leaf),#5fd08f);border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.xp{font-weight:800;font-size:14px;background:var(--sun-soft);color:#8a5a00;padding:7px 11px;border-radius:99px;white-space:nowrap;transition:transform .25s}
.xp.pop{transform:scale(1.18)}

.demo{margin-top:10px;font-size:13px;background:var(--clay-soft);color:#8a2f12;padding:8px 12px;border-radius:12px;text-align:center}

.stage{flex:1;display:flex;flex-direction:column;padding-top:18px}
.screen{animation:in .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.screen.back-anim{animation-name:inb}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.q{font-size:clamp(24px,6.4vw,30px);font-weight:800;margin:6px 0 6px;color:var(--forest)}
.sub{color:var(--muted);font-size:15.5px;margin-bottom:18px}

/* Option cards */
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:14px 16px;font-weight:700;font-size:16px;transition:border-color .15s,transform .12s,background .15s;min-height:62px}
.opt:active{transform:scale(.98)}
.opt .em{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.opt .tx small{display:block;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt.sel{border-color:var(--leaf);background:var(--leaf-soft)}
.opt .chk{margin-left:auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:#fff}
.opt.round .chk{border-radius:50%}
.opt.sel .chk{background:var(--leaf);border-color:var(--leaf)}
.opt.sel .chk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* Picture cards (problems) */
.pic{flex-direction:column;align-items:stretch;padding:0;overflow:hidden;gap:0;min-height:0}
.pic svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.pic .lbl{padding:10px 12px 12px;font-size:14.5px;line-height:1.25;display:flex;gap:8px;align-items:flex-start}
.pic .lbl .chk{margin-left:auto}
.pic.wide{grid-column:1/-1;flex-direction:row;align-items:center;padding:14px 16px;gap:14px}

/* Scale (frequency) */
.scale{display:grid;gap:8px}

/* Inputs */
.field{display:grid;gap:8px;margin-bottom:16px}
.field label{font-weight:800;font-size:15px;color:var(--forest)}
select,input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);appearance:none}
select:focus,input:focus{outline:none;border-color:var(--leaf)}
.selwrap{position:relative}
.selwrap::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border:solid var(--muted);border-width:0 2.5px 2.5px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* Buttons */
.cta{margin-top:auto;padding-top:20px}
.btn{width:100%;padding:17px 20px;border-radius:16px;font-weight:800;font-size:17.5px;background:var(--forest);color:#fff;
  box-shadow:0 5px 0 #072619;transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #072619}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.sun{background:var(--sun);color:#3d2a00;box-shadow:0 5px 0 #c48d10}
.btn.ghost{background:transparent;color:var(--forest);box-shadow:none;border:2px solid var(--line);margin-top:10px}
.hint{text-align:center;color:var(--muted);font-size:13.5px;margin-top:10px}

/* Intro */
.hero{border-radius:26px;overflow:hidden;background:var(--forest);color:#fff;position:relative}
.hero svg{display:block;width:100%;height:auto}
.hero-body{padding:20px 22px 24px}
.hero h1{font-size:clamp(32px,9vw,42px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{opacity:.88;margin-top:10px;font-size:16px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 12px;border-radius:99px;font-size:13.5px;font-weight:700}
.privacy{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.45;text-align:center}

/* Fact card */
.fact{background:var(--river-soft);border-radius:var(--r);padding:20px;margin-top:4px;border:2px solid #bcd8f6}
.fact h3{color:#134a85;font-size:21px;margin-bottom:8px}
.fact p{line-height:1.5;color:#1f3d5c;font-size:15.5px}
.fact p+p{margin-top:8px}

/* Badge toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--forest);color:#fff;
  padding:12px 18px;border-radius:16px;font-weight:800;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(15,61,46,.35);
  transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s;z-index:9;max-width:92vw;opacity:0;visibility:hidden}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast b{font-size:24px}

/* Result */
.result-head{text-align:center}
.medal{width:120px;height:120px;margin:4px auto 10px;animation:spin 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spin{from{transform:scale(.2) rotate(-200deg);opacity:0}to{transform:none;opacity:1}}
.gauge{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;margin:16px 0}
.gauge h3{font-size:18px;color:var(--forest)}
.meter{height:16px;border-radius:99px;background:linear-gradient(90deg,#3cc77a,#f5b82e 50%,#e0643c);position:relative;margin:16px 0 8px}
.meter i{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--forest);transform:translate(-50%,-50%);left:0;transition:left 1.2s cubic-bezier(.2,1,.3,1) .3s}
.meter-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700}
.level{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-weight:800;font-size:26px;margin-top:10px}
.gauge p{color:var(--muted);font-size:15px;line-height:1.45;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:13px;font-weight:800;padding:6px 10px;border-radius:99px;background:var(--clay-soft);color:#8a2f12}
.challenge{background:var(--sun-soft);border:2px dashed #e7b23f;border-radius:var(--r);padding:18px;margin-bottom:6px}
.challenge h3{font-size:19px;color:#6b4300}
.challenge p{color:#6b4a10;margin-top:6px;line-height:1.45;font-size:15px}
.status{font-size:14px;font-weight:800;text-align:center;margin:6px 0 14px;padding:10px;border-radius:12px}
.status.ok{background:var(--leaf-soft);color:#11633a}
.status.wait{background:#eee8dc;color:var(--muted)}
.status.err{background:var(--clay-soft);color:#8a2f12}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

.sec{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.sec h3{font-size:18px;color:var(--forest);margin-bottom:4px}
.sec .note{font-size:13px;color:var(--muted);margin-bottom:12px}
.row{margin:10px 0}
.row .lb{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:5px}
.row .lb span:last-child{color:var(--muted);white-space:nowrap}
.track{height:12px;background:#efe9dc;border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .9s cubic-bezier(.2,1,.3,1)}
.row.me .lb span:first-child::after{content:" ← você";color:var(--clay);font-weight:800}
.row.me .track i{background:var(--clay)}
.big{display:flex;gap:10px;margin-bottom:12px}
.big div{flex:1;background:var(--forest);color:#fff;border-radius:16px;padding:14px}
.big b{display:block;font-family:"Bricolage Grotesque",Nunito,sans-serif;font-size:30px;line-height:1}
.big small{font-size:12.5px;opacity:.85}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cmp div{background:var(--paper);border-radius:14px;padding:12px}
.cmp b{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-size:24px;color:var(--forest)}
.cmp small{display:block;font-size:12.5px;color:var(--muted)}
.you{background:var(--river-soft);border:2px solid #bcd8f6;border-radius:var(--r);padding:18px;margin-bottom:12px}
.you h3{color:#134a85;font-size:18px;margin-bottom:6px}
.you li{margin:8px 0 0 18px;color:#1f3d5c;line-height:1.4;font-size:15px}
.mapbox{height:58vh;min-height:340px;border-radius:var(--r);overflow:hidden;border:2px solid var(--line);background:#e8efe9;position:relative;z-index:0}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filters button{flex:none;padding:8px 12px;border-radius:99px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:13.5px}
.filters button.on{background:var(--forest);border-color:var(--forest);color:#fff}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:700}
.legend i{flex:1;height:10px;border-radius:99px;background:linear-gradient(90deg,#3cc77a,#f5b82e,#e0643c)}
.mapnote{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
.leaflet-popup-content{font-family:Nunito,sans-serif;font-size:14px;margin:12px 14px}
.leaflet-popup-content b.t{font-family:"Bricolage Grotesque",Nunito,sans-serif;font-size:16px;color:var(--forest);display:block;margin-bottom:4px}
.leaflet-popup-content .pr{display:flex;justify-content:space-between;gap:12px}
.ranking{margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  return rows.map(r=>`<div class="row${mine(key,r.v)?' me':''}"><div class="lb"><span>${r.label}</span><span>${pct(r.c,d.n)}% · ${r.c}</span></div><div class="track"><i data-w="${pct(r.c,d.n)}"></i></div></div>`).join("");

    <p class="note" style="margin:12px 0 0">Atenção, detetive: a amostra ainda é pequena e veio quase toda de uma turma. Por isso essas diferenças ainda não provam nada. Com mais respostas de toda a escola, o retrato fica confiável.</p>
  </div>
  <div class="sec"><h3>🛠️ O que fazer primeiro</h3>${bars("medidas",d,true)}</div>
  <div class="sec"><h3>🧠 Já conheciam racismo ambiental?</h3>${bars("conhece",d,false)}</div>
  <div class="sec"><h3>🧑‍🤝‍🧑 Quem respondeu</h3>${bars("idade",d,false)}${bars("raca",d,true)}${bars("beneficio",d,false)}
    <p class="note" style="margin:12px 0 0">🚨 Faltam os mais novos: quase ninguém com menos de 15 anos respondeu ainda!</p></div>
  <button class="btn ghost" data-act="map" style="margin-bottom:14px">🗺️ Ver o mapa por bairro</button>
  <div class="cta">${S.finished?`<button class="btn" data-act="closepanel">← Voltar ao meu resultado</button>`:`<button class="btn sun" data-act="start">Começar minha missão →</button><button class="btn ghost" data-act="closepanel">← Voltar</button>`}</div>`;
}
/* ---------- Mapa ---------- */
const PROB = {todos:"Todos os problemas", enchente:"🌊 Alagamento", lixo:"🗑️ Lixo / praças", esgoto:"🦠 Esgoto", agua:"🚱 Falta d'água"};
let MAPA_NOVO = null, mapaFiltro = "todos", lmap = null, lcamada = null;
function mapaDados(){
  const t = JSON.parse(JSON.stringify(MAPA_ANTIGO));
  const somar=(b,o)=>{ const a=t[b]||(t[b]={n:0,enchente:0,lixo:0,agua:0,esgoto:0,nenhum:0,freq:0}); for(const k in a) a[k]+=(+o[k]||0); };
  if(MAPA_NOVO) MAPA_NOVO.forEach(r=>somar(r.bairro,r));
  else if(S.finished && S.bairro){ const p=S.a.problemas||[]; somar(S.bairro,{n:1,enchente:p.some(v=>/Enchentes/.test(v)),lixo:p.some(v=>/lixo/.test(v)),agua:p.some(v=>/abastecimento/.test(v)),esgoto:p.some(v=>/Esgoto/.test(v)),nenhum:p.some(v=>/Nenhum/.test(v)),freq:/Frequentemente|Sempre/.test(S.a.frequencia||"")}); }
  return t;
}
function parseCSV(txt){
  const lines=txt.trim().split(/\r?\n/).map(l=>l.split(",").map(c=>c.replace(/^"|"$/g,"").trim()));
  const h=lines.shift(); return lines.filter(l=>l[0]).map(l=>Object.fromEntries(h.map((k,i)=>[k,i?+l[i]||0:l[i]])));
}
async function carregarMapaNovo(){
  if(!CONFIG.mapaCsv || MAPA_NOVO) return;
  try{ const r=await fetch(CONFIG.mapaCsv+(CONFIG.mapaCsv.includes("?")?"&":"?")+"t="+Date.now()); MAPA_NOVO=parseCSV(await r.text()); }catch(e){ MAPA_NOVO=null; }
}
function cor(v){ // v de 0 a 1
  const s=[[60,199,122],[245,184,46],[224,100,60]]; const x=Math.max(0,Math.min(1,v))*2, i=Math.min(1,Math.floor(x)), f=x-i;
  const c=s[i].map((a,j)=>Math.round(a+(s[i+1][j]-a)*f)); return `rgb(${c})`;
}
function mapHTML(){
  return `<div class="kicker">Mapa da investigação</div>
  <h2 class="q">Onde estão os problemas?</h2>
  <p class="sub">Cada círculo é um bairro: quanto maior, mais detetives responderam. Toque para ver os detalhes.</p>
  <div class="filters">${Object.entries(PROB).map(([k,v])=>`<button data-f="${k}" class="${k===mapaFiltro?'on':''}">${v}</button>`).join("")}</div>
  <div class="mapbox" id="lmap"></div>
  <div class="legend"><span id="legA">0</span><i></i><span id="legB">4 problemas</span></div>
  <p class="mapnote" id="mapnote"></p>
  <div class="sec ranking"><h3 id="rankT">Bairros com mais problemas</h3><div id="rank"></div></div>
  <p class="mapnote">🔒 O mapa mostra só totais por bairro, nunca endereços. Bairros com menos de 3 respostas aparecem sem detalhes, para ninguém ser identificado.</p>
  <div class="cta"><button class="btn" data-act="closemap">← Voltar</button></div>`;
}
function valorBairro(a){
  if(mapaFiltro==="todos") return (a.enchente+a.lixo+a.agua+a.esgoto)/a.n/4*2; // média de problemas (0–2+) normalizada
  return a[mapaFiltro]/a.n;
}
function desenhar(){
  const t=mapaDados(); const L=window.L;
  if(lcamada) lcamada.remove();
  lcamada=L.layerGroup().addTo(lmap);
  let semLocal=0, total=0; const rows=[];
  for(const [b,a] of Object.entries(t)){
    total+=a.n;
    if(!COORD[b]){ semLocal+=a.n; continue; }
    const v=valorBairro(a), poucos=a.n<3;
    const media=((a.enchente+a.lixo+a.agua+a.esgoto)/a.n);
    const pc=k=>Math.round(100*a[k]/a.n)+"%";
    const det = poucos ? `<span style="color:#5d6b64">Poucas respostas ainda: detalhes aparecem a partir de 3.</span>` :
      `<div class="pr"><span>🌊 Alagamento</span><b>${pc("enchente")}</b></div><div class="pr"><span>🗑️ Lixo / praças</span><b>${pc("lixo")}</b></div><div class="pr"><span>🦠 Esgoto</span><b>${pc("esgoto")}</b></div><div class="pr"><span>🚱 Falta d'água</span><b>${pc("agua")}</b></div><div class="pr" style="margin-top:4px"><span>Afeta com frequência</span><b>${pc("freq")}</b></div>`;
    const isMe = S.finished && S.bairro===b;
    L.circleMarker(COORD[b],{radius:8+Math.sqrt(a.n)*5,color:isMe?"#0f3d2e":"#fff",weight:isMe?4:2,fillColor:poucos?"#9aa7a0":cor(v),fillOpacity:.85})
      .bindPopup(`<b class="t">${escapeHTML(b)}${isMe?" · seu bairro":""}</b>${a.n} resposta${a.n>1?"s":""}<div style="margin-top:6px">${det}</div>`).addTo(lcamada);
    if(!poucos) rows.push({b,a,v,media});
  }
  rows.sort((x,y)=>y.v-x.v);
  const lbl = mapaFiltro==="todos" ? "problemas por pessoa (média)" : "% que apontam "+PROB[mapaFiltro].replace(/^\S+ /,"").toLowerCase();
  document.getElementById("rankT").textContent = mapaFiltro==="todos" ? "Bairros com mais problemas" : "Onde mais aparece: "+PROB[mapaFiltro].replace(/^\S+ /,"");
  document.getElementById("rank").innerHTML = rows.slice(0,6).map(r=>{ const w=mapaFiltro==="todos"?Math.round(r.media/4*100):Math.round(r.v*100);
    return `<div class="row${S.finished&&S.bairro===r.b?' me':''}"><div class="lb"><span>${escapeHTML(r.b)}</span><span>${mapaFiltro==="todos"?r.media.toFixed(1).replace(".",","):w+"%"} · ${r.a.n} resp.</span></div><div class="track"><i data-w="${w}" style="width:${w}%"></i></div></div>`; }).join("") + `<p class="note" style="margin-top:8px">Medida: ${lbl}. Só bairros com 3 ou mais respostas.</p>`;
  document.getElementById("legA").textContent = mapaFiltro==="todos"?"0":"0%";
  document.getElementById("legB").textContent = mapaFiltro==="todos"?"2+ problemas":"100%";
  document.getElementById("mapnote").textContent = `${total} respostas no mapa${MAPA_NOVO?" (1ª rodada + respostas novas, atualizado agora)":" (1ª rodada da pesquisa"+(S.finished?" + a sua)":")")}${semLocal?` · ${semLocal} sem bairro no mapa`:""}.`;
}
async function initMap(el){
  el.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{ mapaFiltro=b.dataset.f; el.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("on",x===b)); desenhar(); }));
  if(!window.L){ document.getElementById("lmap").innerHTML='<p style="padding:20px;color:#5d6b64">Não foi possível carregar o mapa. Verifique a internet.</p>'; return; }
  if(lmap){ lmap.remove(); lmap=null; }
  lmap=L.map("lmap",{zoomControl:true,attributionControl:true}).setView([-1.37,-48.40],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(lmap);
  desenhar();
  setTimeout(()=>{ try{ lmap.invalidateSize(); lmap.fitBounds(L.featureGroup(lcamada.getLayers()).getBounds().pad(0.15),{maxZoom:13}); }catch(e){} },350);
  await carregarMapaNovo();
  if(MAPA_NOVO && lmap) desenhar();
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- Interação ---------- */
function bind(el){
  el.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.act)));
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.querySelectorAll(".track i").forEach(i=>i.style.width=i.dataset.w+"%")));
  if(S.map){ initMap(el); return; }
  if(S.panel) return;
  const q = Q[S.i];
  if(q && q.options){
    el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(q,+b.dataset.i,el)));
  }
  if(q && q.type==="local"){
    const sel = el.querySelector("#bairro"), inp = el.querySelector("#turma"), btn = el.querySelector("[data-act=finish]");
    const upd=()=>{ S.bairro=sel.value; S.turma=inp.value; btn.disabled=!(S.bairro&&S.turma.trim()); };
    sel.addEventListener("change",upd); inp.addEventListener("input",upd);
  }
  if(S.i>=Q.length){
    requestAnimationFrame(()=>{ const n=document.getElementById("needle"); if(n) n.style.left=score().value+"%"; });
  }
}

function pick(q,idx,el){
  const o = q.options[idx];
  if(q.type==="multi"){
    let cur = S.a[q.key]||[];
    if(o.none) cur = cur.includes(o.v)?[]:[o.v];
    else { cur = cur.filter(v=>v!=="Nenhum desses problemas"); cur = cur.includes(o.v)?cur.filter(v=>v!==o.v):[...cur,o.v]; }
    S.a[q.key]=cur;
    el.querySelectorAll(".opt").forEach((b,i)=>{ const s=cur.includes(q.options[i].v); b.classList.toggle("sel",s); b.setAttribute("aria-pressed",s); });
    el.querySelector("[data-act=next]").disabled = cur.length===0;
    return;
  }
  const first = !S.a[q.key];
  S.a[q.key]=o.v;
  el.querySelectorAll(".opt").forEach((b,i)=>{ const s=i===idx; b.classList.toggle("sel",s); b.setAttribute("aria-pressed",s); });
  if(q.fact && first){
    gain();
    const slot = el.querySelector("#factslot");
    slot.innerHTML = `<div class="fact screen" style="margin-top:16px"><h3>${q.fact.title}</h3>${q.fact.body.map(p=>`<p>${p}</p>`).join("")}</div><div class="cta"><button class="btn" data-act="go">Entendi, próxima pista →</button></div>`;
    slot.querySelector("[data-act=go]").addEventListener("click",()=>advance(false));
    badge("🧠","Conquista: Mente Afiada");
    setTimeout(()=>slot.scrollIntoView({behavior:"smooth",block:"start"}),80);
    return;
  }
  if(q.fact) return;
  setTimeout(()=>advance(first),260);
}

function gain(){ S.xp+=XP_PER; const x=document.getElementById("xp"); x.textContent="⭐ "+S.xp+" XP"; x.classList.add("pop"); setTimeout(()=>x.classList.remove("pop"),250); }

function advance(addXp=true){
  if(addXp) gain();
  S.i++;
  if(S.i===1) badge("🔎","Conquista: Primeira Pista!");
  if(S.i===5) badge("🌱","Metade da missão! Falta pouco");
  render(1);
}

function act(a){
  if(a==="start"){ S.panel=false; S.map=false; S.i=0; render(1); }
  else if(a==="panel"){ S.map=false; S.panel=true; render(1); }
  else if(a==="map"){ S.map=true; render(1); }
  else if(a==="closemap"){ S.map=false; render(-1); }
  else if(a==="closepanel"){ S.panel=false; render(-1); }
  else if(a==="next"){ const k=Q[S.i].key, f=!S.badges.has(k); S.badges.add(k); advance(f); }
  else if(a==="finish"){ S.finished=true; gain(); S.i=Q.length; render(1); submit(); confetti(); store("rac_amb_done","1"); }
  else if(a==="copy"){
    const url = location.href.split("#")[0];
    navigator.clipboard.writeText(url).then(()=>badge("📋","Link copiado! Mande no grupo da turma")).catch(()=>badge("🔗","Copie o link da barra do navegador"));
  }
  else if(a==="again"){ S.finished=false; S.i=-1; S.a={}; S.xp=0; S.bairro=""; S.turma=""; S.badges.clear(); render(-1); }
}

document.getElementById("back").addEventListener("click",()=>{ if(S.i>0){ S.i--; render(-1);} });

let toastT;
function badge(icon,text){
  const t=document.getElementById("toast");
  document.getElementById("toastIcon").textContent=icon; document.getElementById("toastText").textContent=text;
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- Envio para o Google Forms ---------- */
function setSt(h){ S.st=h; const e=document.getElementById("sendStatus"); if(e) e.innerHTML=h; }
function submit(){
  const st = {set innerHTML(h){ setSt(h); }};
  if(!configured){ st.innerHTML='<div class="status wait">🧪 Modo teste: resposta não enviada.</div>'; return; }
  st.innerHTML='<div class="status wait">⏳ Enviando sua investigação…</div>';
  const f = document.createElement("form");
  f.method="POST"; f.target="gf_sink";
  f.action=`https://docs.google.com/forms/d/e/${CONFIG.formId}/formResponse`;
  const add=(k,v)=>{ const i=document.createElement("input"); i.type="hidden"; i.name="entry."+CONFIG.entries[k]; i.value=v; f.appendChild(i); };
  ["raca","beneficio","idade","genero","conhece","frequencia","poder","medidas"].forEach(k=>add(k,S.a[k]));
  (S.a.problemas||[]).forEach(v=>add("problemas",v));
  add("local", `Bairro: ${S.bairro} | Turma: ${S.turma.trim()}`);
  document.body.appendChild(f);
  const sink=document.getElementById("gf_sink");
  let ok=false;
  sink.onload=()=>{ if(ok) return; ok=true; st.innerHTML='<div class="status ok">✅ Investigação registrada! Obrigado por participar.</div>'; f.remove(); };
  setTimeout(()=>{ if(!ok) st.innerHTML='<div class="status err">⚠️ Não conseguimos confirmar o envio. Verifique a internet.</div>'; },12000);
  f.submit();
}

/* ---------- Confete ---------- */
function confetti(){
  const c=document.getElementById("confetti"), x=c.getContext("2d");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  c.width=innerWidth; c.height=innerHeight;
  const cols=["#22a865","#f5b82e","#2a7fd4","#e0643c","#0f3d2e"];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,c:cols[Math.random()*5|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6}));
  let f=0;(function loop(){ x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});
    if(++f<200) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);})();
}

render(1);
</script>

  3. Cole o ID_DO_FORM em CONFIG.formId e cada número entry.XXX no campo correspondente de CONFIG.entries.
  4. Em Configurações > Respostas, deixe DESLIGADO "Restringir a usuários" / "Coletar e-mails" (exigir login bloqueia o envio).
  Obs.: os textos das opções aqui são idênticos aos do formulário. Se alterar uma opção no Forms, altere aqui também.
